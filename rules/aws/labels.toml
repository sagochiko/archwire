# Sentences for diagnostics notes and hole needs. `{from}` and `{to}` are part names.
["note.aux_not_routed"]
en = "Auxiliary flows (~>) are drawn as lines only; their network route is not handled."
ja = "補助の流れ（~>）は経路を扱わず、線だけを描く。"

["note.endpoint_not_drawn"]
en = "VPC endpoint icons are not drawn."
ja = "VPC エンドポイントのアイコンは描かない。"

["note.cross_az_merged"]
en = "With three Availability Zones, lines between parts in different zones are not drawn: each line inside a zone stands for the lines from every zone into the same part."
ja = "AZ が3つのときは AZ をまたぐ線を描かず、同じ AZ の中の1本で、各 AZ から同じ部品への線をまとめて表す。"

["note.unrouted_line"]
en = "The line {line} could not avoid every icon, label and other line; check it in the diagram."
ja = "{line} の線は、アイコン、ラベル、ほかの線のどれかを避けきれなかった。図で確かめること。"

["note.unplaced_label"]
en = "The label of the line {line} could not be placed clear of every icon, text and other line; check it in the diagram."
ja = "{line} の線のラベルは、アイコン、文字、ほかの線のどれかを避けて置けなかった。図で確かめること。"

["need.route"]
en = "Route from {from} to {to}"
ja = "{from} から {to} への経路"

