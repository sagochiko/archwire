version = "2026.11.14"

# kind = "constraint": states an AWS constraint; `source` (AWS documentation URL) is required.
# kind = "default": a choice archwire makes when the definition is silent; `source` is optional.

[[rule]]
id = "resources-inside-aws-cloud-frame"
kind = "default"
reason_en = "AWS resources are drawn inside the AWS Cloud frame."
reason_ja = "AWS のリソースは AWS Cloud の枠の中に描く。"

[[rule]]
id = "global-service-outside-region"
kind = "default"
source = "https://docs.aws.amazon.com/whitepapers/latest/aws-fault-isolation-boundaries/global-services.html"
reason_en = "AWS lists Amazon CloudFront, Amazon Route 53 and AWS WAF for CloudFront among the global services, whose resources are not Region-specific. archwire draws global services inside the AWS Cloud frame and outside the Region frame."
reason_ja = "AWS は Amazon CloudFront、Amazon Route 53、AWS WAF for CloudFront を、リソースがリージョンに属さないグローバルサービスに挙げている。archwire はグローバルサービスを AWS Cloud の枠の中、リージョンの枠の外に描く。"

[[rule]]
id = "cloudfront-certificate-in-us-east-1"
kind = "constraint"
source = "https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html"
reason_en = "To use an AWS Certificate Manager certificate with a CloudFront distribution, the certificate is requested or imported in US East (N. Virginia) (us-east-1). archwire draws it outside the Region frame and writes us-east-1 under its name."
reason_ja = "CloudFront のディストリビューションで AWS Certificate Manager の証明書を使うには、証明書を米国東部（バージニア北部）（us-east-1）でリクエストまたはインポートする。archwire は証明書をリージョンの枠の外に描き、名前の下に us-east-1 と書く。"

[[rule]]
id = "regional-service-outside-vpc"
kind = "default"
reason_en = "Regional services that are not placed in a VPC subnet are drawn inside the Region frame and outside the VPC frame."
reason_ja = "VPC のサブネットに置かないリージョンのサービスは、リージョンの枠の中、VPC の枠の外に描く。"

[[rule]]
id = "load-balancer-in-vpc"
kind = "constraint"
source = "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-application-load-balancer.html"
reason_en = "An Application Load Balancer is created in subnets of a VPC, so a VPC is drawn."
reason_ja = "Application Load Balancer は VPC のサブネットに作るので、VPC を描く。"

[[rule]]
id = "alb-spans-two-azs"
kind = "constraint"
source = "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html"
reason_en = "An Application Load Balancer requires subnets in at least two Availability Zones."
reason_ja = "Application Load Balancer には、2つ以上のアベイラビリティゾーンのサブネットが要る。"

[[rule]]
id = "internet-facing-alb-in-vpc-with-igw"
kind = "constraint"
source = "https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-application-load-balancer.html"
reason_en = "With an internet-facing Application Load Balancer, only VPCs that have an Internet Gateway can be selected, so the VPC gets an Internet Gateway."
reason_ja = "インターネット向けの Application Load Balancer では、Internet Gateway のある VPC しか選べないので、VPC に Internet Gateway を置く。"

[[rule]]
id = "private-egress-through-nat"
kind = "constraint"
source = "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat.html"
reason_en = "Resources in a private subnet can connect to the internet through a NAT device in a public subnet, which replaces their source IPv4 addresses with its own."
reason_ja = "プライベートサブネットのリソースは、パブリックサブネットに置いた NAT デバイスを通じてインターネットへ接続できる。NAT デバイスは、送信元の IPv4 アドレスを自分のアドレスに置きかえる。"

[[rule]]
id = "nat-device-is-nat-gateway"
kind = "default"
source = "https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat.html"
reason_en = "You can use the managed NAT device AWS offers, the NAT gateway, or build your own NAT device on EC2, a NAT instance; AWS recommends NAT gateways for better availability and bandwidth and less administration. archwire draws a NAT gateway."
reason_ja = "AWS が提供するマネージドな NAT デバイスである NAT ゲートウェイを使うことも、EC2 インスタンス上に自分で NAT デバイス（NAT インスタンス）を作ることもできる。AWS は、可用性と帯域幅が優れ管理の手間が少ない NAT ゲートウェイを推奨している。archwire は NAT ゲートウェイを描く。"

[[rule]]
id = "nat-per-az"
kind = "default"
source = "https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-scenarios.html"
reason_en = "One NAT gateway per Availability Zone keeps outbound traffic working when another zone fails."
reason_ja = "NAT Gateway をアベイラビリティゾーンごとに置くと、ほかのゾーンが止まっても外向きの通信が続く。"

[[rule]]
id = "default-two-azs"
kind = "default"
reason_en = "No number of Availability Zones was given, so two are used, the minimum an Application Load Balancer accepts."
reason_ja = "AZ の数の指定が無いので、Application Load Balancer が受け付ける最小の2つにする。"

[[rule]]
id = "public-and-private-subnet-per-az"
kind = "default"
reason_en = "archwire gives each Availability Zone one public subnet and one private subnet."
reason_ja = "archwire は、各アベイラビリティゾーンにパブリックサブネットとプライベートサブネットを1つずつ置く。"

[[rule]]
id = "public-subnet-per-az"
kind = "default"
reason_en = "archwire gives each Availability Zone one public subnet; no part here is placed in a private subnet."
reason_ja = "archwire は、各アベイラビリティゾーンにパブリックサブネットを1つ置く。プライベートサブネットに置く部品は無い。"

[[rule]]
id = "private-subnet-per-az"
kind = "default"
reason_en = "archwire gives each Availability Zone one private subnet; no part here is placed in a public subnet."
reason_ja = "archwire は、各アベイラビリティゾーンにプライベートサブネットを1つ置く。パブリックサブネットに置く部品は無い。"

[[rule]]
id = "compute-in-private"
kind = "default"
reason_en = "No subnet was given, so ECS is placed in private subnets; traffic reaches it through the load balancer."
reason_ja = "サブネットの指定が無いので、ECS はプライベートサブネットに置く。外からの通信はロードバランサーが受ける。"

[[rule]]
id = "database-in-private"
kind = "default"
reason_en = "No subnet was given, so Aurora is placed in private subnets so it is not reachable from the internet."
reason_ja = "サブネットの指定が無いので、Aurora はインターネットから届かないプライベートサブネットに置く。"

[[rule]]
id = "aurora-writer-reader"
kind = "default"
reason_en = "The Writer goes in the first Availability Zone and Readers in the remaining ones."
reason_ja = "Writer を1つ目の AZ に、Reader を残りの AZ に置く。"

[[rule]]
id = "default-region"
kind = "default"
reason_en = "No Region was given, so ap-northeast-1 (Tokyo) is used."
reason_ja = "リージョンの指定が無いので、ap-northeast-1（東京）にする。"

[[rule]]
id = "resources-inside-region-frame"
kind = "default"
reason_en = "AWS resources that belong to a Region are drawn inside that Region's frame."
reason_ja = "リージョンに属する AWS のリソースは、そのリージョンの枠の中に描く。"

[[rule]]
id = "cognito-user-pool-in-one-region"
kind = "constraint"
source = "https://docs.aws.amazon.com/cognito/latest/developerguide/security-cognito-regional-data-considerations.html"
reason_en = "Amazon Cognito user pools are each created in one AWS Region. archwire draws the user pool inside the Region frame."
reason_ja = "Amazon Cognito のユーザープールは、それぞれ1つの AWS リージョンに作られる。archwire はユーザープールをリージョンの枠の中に描く。"

[[rule]]
id = "rest-api-cognito-authorizer"
kind = "default"
source = "https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-enable-cognito-user-pool.html"
reason_en = "To integrate a REST API with an Amazon Cognito user pool, a COGNITO_USER_POOLS authorizer that uses the user pool is created in API Gateway. archwire draws the association as that authorizer."
reason_ja = "REST API を Amazon Cognito のユーザープールと統合するには、API Gateway で、そのユーザープールを使う COGNITO_USER_POOLS オーソライザーを作る。archwire はこの関連付けを、そのオーソライザーとして描く。"

[[rule]]
id = "http-api-jwt-authorizer"
kind = "default"
source = "https://docs.aws.amazon.com/apigatewayv2/latest/api-reference/apis-apiid-authorizers.html"
reason_en = "The JWT authorizer type is supported only for HTTP APIs, and an Amazon Cognito user pool can be the issuer of the tokens. archwire draws the association as a JWT authorizer."
reason_ja = "JWT オーソライザーのタイプは HTTP API でのみサポートされ、トークンの発行者には Amazon Cognito のユーザープールを指定できる。archwire はこの関連付けを JWT オーソライザーとして描く。"

[[rule]]
id = "alb-certificate-in-load-balancer-region"
kind = "constraint"
source = "https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html"
reason_en = "Certificates in AWS Certificate Manager are regional resources: to use a certificate with Elastic Load Balancing for the same domain names in more than one Region, a certificate is requested or imported for each Region, and a certificate cannot be copied between Regions. archwire draws the certificate attached to an Application Load Balancer inside the Region frame."
reason_ja = "AWS Certificate Manager の証明書はリージョンのリソースで、同じドメイン名の証明書を複数のリージョンの Elastic Load Balancing で使うには、リージョンごとに証明書をリクエストまたはインポートする。証明書はリージョンの間でコピーできない。archwire は、Application Load Balancer に付けた証明書をリージョンの枠の中に描く。"

[[rule]]
id = "regional-web-acl-in-resource-region"
kind = "constraint"
source = "https://docs.aws.amazon.com/waf/latest/developerguide/how-aws-waf-works-resources.html"
reason_en = "A web ACL (protection pack) and the AWS WAF resources it uses must be located in the same Region as the resources it protects, and an Application Load Balancer is one of the regional resource types AWS WAF can protect. archwire draws the web ACL attached to an Application Load Balancer inside the Region frame."
reason_ja = "web ACL（保護パック）と、それが使う AWS WAF のリソースは、保護するリソースと同じリージョンに置かなければならない。Application Load Balancer は、AWS WAF で保護できるリージョンのリソースの1つ。archwire は、Application Load Balancer に付けた web ACL をリージョンの枠の中に描く。"

[[rule]]
id = "one-web-acl-per-resource"
kind = "constraint"
source = "https://docs.aws.amazon.com/waf/latest/developerguide/how-aws-waf-works-resources.html"
reason_en = "A single web ACL (protection pack) can be associated with one or more AWS resources, but each AWS resource can be associated with only one web ACL."
reason_ja = "1つの web ACL（保護パック）は1つ以上の AWS リソースに関連付けられるが、AWS のリソース1つに関連付けられる web ACL は1つだけ。"

[[rule]]
id = "function-attaches-to-resource-vpc"
kind = "constraint"
source = "https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html"
reason_en = "A Lambda function can be given access to resources in an Amazon VPC by attaching it to the VPC through the private subnets that contain the resources. archwire draws a function that connects to a part in a VPC in that VPC's private subnets."
reason_ja = "Lambda 関数は、リソースを含むプライベートサブネットを通じて VPC にアタッチすると、Amazon VPC 内のリソースにアクセスできる。archwire は、VPC の中の部品につなぐ関数を、その VPC のプライベートサブネットに描く。"

[[rule]]
id = "attached-function-per-az"
kind = "default"
source = "https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc.html"
reason_en = "Every Lambda function runs inside a VPC that Lambda owns and manages; attaching a function to a VPC gives it a network interface that Lambda creates for the chosen subnet and security group combination. archwire draws the attached function once in the private subnet of each Availability Zone."
reason_ja = "Lambda 関数はどれも、Lambda が所有し管理する VPC の中で動く。関数を VPC にアタッチすると、選んだサブネットとセキュリティグループの組み合わせに対して Lambda が作るネットワークインターフェイスを使う。archwire は、アタッチした関数を、各アベイラビリティゾーンのプライベートサブネットに1つずつ描く。"

[[rule]]
id = "attached-function-internet-through-nat"
kind = "constraint"
source = "https://docs.aws.amazon.com/lambda/latest/dg/configuration-vpc-internet.html"
reason_en = "A function attached to a VPC can reach only resources in that VPC unless the VPC has internet access, and a private subnet can reach the internet for IPv4 through a NAT gateway. archwire adds a NAT gateway in a public subnet for the attached function's internet access over IPv4."
reason_ja = "VPC にアタッチした関数は、VPC にインターネットアクセスが無ければ、その VPC 内のリソースにしか届かない。IPv4 では、プライベートサブネットは NAT ゲートウェイを通じてインターネットにアクセスできる。archwire は、アタッチした関数の IPv4 でのインターネットアクセスのために、パブリックサブネットに NAT ゲートウェイを足す。"

[[rule]]
id = "aurora-cluster-in-vpc"
kind = "constraint"
source = "https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.CreateInstance.html"
reason_en = "An Amazon Aurora DB cluster can be created only in a VPC, so a VPC is drawn."
reason_ja = "Amazon Aurora の DB クラスターは VPC の中にだけ作成できるので、VPC を描く。"

[[rule]]
id = "aurora-subnet-group-two-azs"
kind = "constraint"
source = "https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.CreateInstance.html"
reason_en = "The DB subnet group chosen for an Aurora DB cluster must cover at least two Availability Zones. archwire draws at least two Availability Zones."
reason_ja = "Aurora の DB クラスターに選ぶ DB サブネットグループは、少なくとも2つのアベイラビリティゾーンを覆わなければならない。archwire は、2つ以上のアベイラビリティゾーンを描く。"

[[rule]]
id = "default-two-azs-for-database"
kind = "default"
reason_en = "No number of Availability Zones was given, so two are used."
reason_ja = "AZ の数の指定が無いので、2つにする。"

[[rule]]
id = "ec2-instance-in-subnet"
kind = "constraint"
source = "https://aws.amazon.com/vpc/faqs/"
reason_en = "An Amazon EC2 instance is launched in a subnet, in the Availability Zone associated with that subnet, so a VPC is drawn."
reason_ja = "Amazon EC2 のインスタンスはサブネットに起動され、そのサブネットに関連付けられたアベイラビリティゾーンで動くので、VPC を描く。"

[[rule]]
id = "instances-in-private"
kind = "default"
reason_en = "No subnet was given, so the EC2 instances are placed in private subnets, which are not reachable from the internet. archwire draws one in the private subnet of each Availability Zone."
reason_ja = "サブネットの指定が無いので、EC2 のインスタンスは、インターネットから届かないプライベートサブネットに置く。archwire は、各アベイラビリティゾーンのプライベートサブネットに1つずつ描く。"

[[rule]]
id = "default-two-azs-for-instances"
kind = "default"
reason_en = "No number of Availability Zones was given, so two are used."
reason_ja = "AZ の数の指定が無いので、2つにする。"
