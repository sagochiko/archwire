# The accepted connections, one entry per service pair and relation.
# In a definition without a VPC part, any connection not listed here stops with UNSUPPORTED.
#
# `label` is a key of labels.toml. `to_kind` gives, per kind of `to`, the label of the
# connection and the rule whose reason is given to `to`; while the kind is not decided the
# connection keeps `label`. `to_role` gives, per role of the `to` part (`writer`, `reader`),
# the label of the connection. `max_from` limits how many `from` parts one `to` part may have,
# with `max_rule` saying why. `from_region` places the `from` part in that Region, and
# `from_scope` (`regional` or `global`) gives it that scope instead of its service's, with
# `from_rule` saying why. `from_subnet` places the `from` part in that subnet tier of the VPC,
# one copy per Availability Zone, with `from_subnet_rule` saying why it is in the VPC and
# `from_copies_rule` why there is one copy per zone; the three are written together.
#
# `[[derived_link]]` gives the lines inference adds between parts by their roles (`private`,
# `egress_nat`, `entry_gateway`, `writer`, `reader`), one entry per pair of roles.

